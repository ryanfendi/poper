
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111426">
<title>POPER — Phone Identity</title>

<style>
*{box-sizing:border-box}
body{
margin:0;background:#101323;color:#f4f5ff;
font-family:system-ui,sans-serif
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:600px;margin:auto;padding:18px}
.header{
display:flex;align-items:center;justify-content:space-between;
padding:12px 0 22px
}
.logo{font-size:25px;font-weight:900}
.logo span{color:#9b7cff}
.card{
background:#1a1f33;border:1px solid #303650;
border-radius:20px;padding:18px;margin-bottom:15px
}
h2{font-size:19px;margin:0 0 12px}
p{color:#aab0c9;line-height:1.6}
input,textarea{
width:100%;background:#101528;color:white;
border:1px solid #3a405a;border-radius:12px;
padding:13px;margin:7px 0 13px;outline:none
}
textarea{min-height:100px;resize:vertical}
button.primary{
width:100%;padding:14px;border:0;border-radius:12px;
background:linear-gradient(120deg,#8b5cf6,#537dff);
color:white;font-weight:800;margin:5px 0
}
button.secondary{
background:#2a3047;color:#fff;border:0;
border-radius:10px;padding:11px
}
button.danger{background:#442837;color:#ffabb8}
.tabs{
display:flex;gap:8px;overflow:auto;margin-bottom:15px
}
.tab{
flex:1;min-width:75px;border:0;padding:12px 8px;
border-radius:12px;background:#20253a;color:#aab0c9
}
.tab.active{background:#7958d8;color:#fff}
.section{display:none}
.section.active{display:block}
.item{
background:#101528;padding:13px;border-radius:12px;
margin:9px 0;overflow-wrap:anywhere
}
.item a{color:#a991ff}
small{color:#8e95b2}
#status{font-size:13px;min-height:20px}
.avatar{
width:70px;height:70px;border-radius:50%;
display:grid;place-items:center;font-size:30px;
background:#2d3653;margin-bottom:10px
}
[hidden]{display:none!important}

  
#qrType {
  width:100%;
  padding:14px;
  background:#101528;
  color:#fff;
  border:1px solid #3a405a;
  border-radius:12px;
  margin:7px 0 13px;
}

.qr-card {
  background:#101528;
  padding:16px;
  border-radius:16px;
  margin-top:14px;
  border:1px solid #303650;
}

.qr-card-title {
  font-size:17px;
  font-weight:800;
  margin-bottom:8px;
}

.qr-badge {
  display:inline-block;
  font-size:11px;
  color:#c6b5ff;
  background:#32284f;
  padding:5px 9px;
  border-radius:20px;
  margin-bottom:10px;
}

.qr-data {
  font-size:13px;
  color:#aab0c9;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
  max-height:120px;
  overflow-y:auto;
  margin-bottom:12px;
}

.qr-actions {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.qr-actions button {
  flex:1;
  min-width:90px;
}

.qr-empty {
  text-align:center;
  padding:25px 10px;
  color:#8991ae;
}

#qrUrl {
  min-height:120px;
}

</style>
</head>

<body>
<div class="app">

<header class="header">
  <div class="logo">📱 POP<span>ER</span></div>
  <button id="logoutBtn" class="secondary" hidden>Logout</button>
</header>

<!-- LOGIN -->
<section id="loginPanel" class="card">
  <h2>Login POPER</h2>
  <p>Masuk menggunakan nomor HP kamu.</p>

  <input id="phoneInput" type="tel" placeholder="08xxxxxxxxxx">
  <button id="sendOtpBtn" class="primary">Kirim OTP</button>

  <div id="recaptcha-container"></div>

  <div id="otpSection" hidden>
    <input id="otpInput" inputmode="numeric" maxlength="6"
      placeholder="Kode OTP 6 digit">
    <button id="verifyOtpBtn" class="primary">Verifikasi OTP</button>
  </div>
  <div id="authStatus"></div>
</section>

<!-- DASHBOARD -->
<main id="dashboard" hidden>

  <div class="card">
    <div class="avatar">👤</div>
    <h2 id="welcome">Selamat datang</h2>
    <small id="myPhone"></small>
  </div>

  <nav class="tabs">
    <button class="tab active" data-tab="bio">Bio</button>
    <button class="tab" data-tab="qr">QR Vault</button>
    <button class="tab" data-tab="notes">Notes</button>
    <button class="tab" data-tab="find">Find Bio</button>
  </nav>

  <!-- BIO -->
  <section class="section active" id="bio">
    <div class="card">
      <h2>Profil Bio Saya</h2>
      <input id="bioName" placeholder="Nama">
      <textarea id="bioDesc" placeholder="Tentang saya"></textarea>
      <input id="bioTitle" placeholder="Judul link">
      <input id="bioUrl" placeholder="https://alamat-link.com">
      <button id="addBioLink" class="secondary">+ Tambah Link</button>
      <div id="bioLinks"></div>
      <button id="saveBio" class="primary">Simpan Bio Online</button>
      <p id="bioStatus"></p>
    </div>
  </section>

  
<!-- QR VAULT -->
<section class="section" id="qr">
  <div class="card">
    <h2>QR Vault</h2>
    <p>Satu tempat untuk menyimpan semua data QR milikmu.</p>

    <label>Jenis data</label>
    <select id="qrType">
      <option value="qris">QRIS / Pembayaran</option>
      <option value="website">Website / Link</option>
      <option value="wifi">WiFi</option>
      <option value="text">Teks / QR lainnya</option>
    </select>

    <input id="qrName" placeholder="Nama (contoh: QRIS Toko)">

    <textarea id="qrUrl"
      placeholder="Tempel isi QR atau URL di sini"></textarea>

    <button id="saveQR" class="primary">
      Simpan ke Vault
    </button>

    <div id="qrList"></div>
  </div>
</section>


  <!-- NOTES -->
  <section class="section" id="notes">
    <div class="card">
      <h2>Notes</h2>
      <input id="noteTitle" placeholder="Judul catatan">
      <textarea id="noteContent" placeholder="Tulis catatan..."></textarea>
      <button id="saveNote" class="primary">Simpan Catatan</button>
      <div id="notesList"></div>
    </div>
  </section>

  <!-- FIND BIO -->
  <section class="section" id="find">
    <div class="card">
      <h2>Find Bio by Phone</h2>
      <p>Cari Bio Link pengguna menggunakan nomor HP.</p>
      <input id="findPhone" type="tel" placeholder="Masukkan nomor HP">
      <button id="findBio" class="primary">Cari Bio</button>
      <div id="findResult"></div>
    </div>
  </section>

</main>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
