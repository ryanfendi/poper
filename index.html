
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101323">
  <title>POPER — Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      background: #101323;
      color: #f4f5ff;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-icon {
      width: 75px;
      height: 75px;
      margin: auto;
      border-radius: 25px;
      display: grid;
      place-items: center;
      font-size: 35px;
      background: linear-gradient(135deg, #8b5cf6, #4e7bff);
    }

    .logo h1 {
      font-size: 30px;
      margin: 12px 0 5px;
    }

    .logo p {
      color: #a3a7c2;
      margin: 0;
    }

    .card {
      background: #1b2035;
      border: 1px solid #303650;
      border-radius: 22px;
      padding: 24px;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .subtitle {
      color: #a5aac4;
      margin: 0 0 22px;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      border: 1px solid #3b415d;
      background: #101528;
      color: white;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #8b5cf6;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      background: linear-gradient(135deg, #8b5cf6, #557cff);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    button.secondary {
      background: #2a3049;
    }

    #recaptcha-container {
      margin: 15px 0;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    .auth-status {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .auth-status.error {
      color: #ff929e;
    }

    .auth-status.success {
      color: #80e4b2;
    }

    [hidden] {
      display: none !important;
    }

    .account {
      text-align: center;
    }

    .account-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 15px;
      display: grid;
      place-items: center;
      background: #2c3654;
      font-size: 30px;
    }

    .account-number {
      padding: 14px;
      margin: 20px 0;
      background: #101528;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    .footer {
      text-align: center;
      color: #747b98;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <header class="logo">
    <div class="logo-icon">📱</div>
    <h1>POPER</h1>
    <p>Your phone number is your identity</p>
  </header>

  <!-- LOGIN -->
  <section class="card" id="loginPanel">

    <h2>Masuk ke POPER</h2>

    <p class="subtitle">
      Gunakan nomor HP untuk masuk atau membuat akun.
      Kami akan mengirim kode verifikasi melalui SMS.
    </p>

    <label for="phoneInput">Nomor HP</label>

    <input
      type="tel"
      id="phoneInput"
      placeholder="08xxxxxxxxxx"
      autocomplete="tel"
    >

    <button id="sendOtpBtn">
      Kirim OTP
    </button>

    <!-- Firebase reCAPTCHA -->
    <div id="recaptcha-container"></div>

    <!-- OTP -->
    <div id="otpSection" hidden>

      <label for="otpInput">Kode OTP 6 digit</label>

      <input
        type="text"
        id="otpInput"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="123456"
      >

      <button id="verifyOtpBtn">
        Verifikasi OTP
      </button>

    </div>

    <div id="authStatus" class="auth-status"></div>

  </section>

  <!-- ACCOUNT -->
  <section class="card account" id="accountPanel" hidden>

    <div class="account-avatar">👤</div>

    <h2>Login Berhasil!</h2>

    <p class="subtitle">
      Nomor HP kamu sudah terverifikasi.
    </p>

    <div class="account-number">
      <strong id="accountPhone">-</strong>
    </div>

    <button id="logoutBtn" class="secondary">
      Logout
    </button>

    <div id="accountStatus" class="auth-status"></div>

  </section>

  <div class="footer">
    POPER · Phone Identity Platform
  </div>

</div>

<script type="module" src="auth.js"></script>

</body>
</html>
